variables:
  #CI_DEBUG_TRACE: "true"
#  DOCKER_DRIVER: overlay
#  DOCKER_HOST: tcp://docker:2375
  MAVEN_CLI_OPTS: "-s ${CI_PROJECT_DIR}/.m2/settings.xml --no-transfer-progress"
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository -Djansi.passthrough=true"


# gitlab_projectid-master
# CI_PROJECT_NAME
# $CI_PROJECT_ID-$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME
cache:
  key: "$CI_PROJECT_NAME"
  paths:
    - .m2/repository/

# Which pipelines exist (the same block in every repo): a merge request gets a merge-request pipeline; a
# branch with an open MR gets no branch pipeline for the same commit (no duplicates); any other branch, the
# default branch and tags get a branch/tag pipeline. Every job carries `rules:`, because a job without
# them is left out of merge-request pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
#  - deploy


before_script:
  # settings.xml for the GitLab Maven package registry this project publishes to (pom.xml
  # distributionManagement, server id `gitlab-maven`). The old file held MVN_USER/MVN_PASS for the
  # decommissioned private Nexus; those CI variables are no longer needed by this project.
  #
  # The heredoc is QUOTED ('XML') on purpose: ${env.CI_JOB_TOKEN} is Maven's own syntax, not the shell's, and
  # an unquoted heredoc would make bash fail on it with "bad substitution". Maven reads the variable itself,
  # so the token is never echoed into the job log and nothing has to be stored anywhere - the pipeline's own
  # job token is the credential, and it dies with the job.
  - mkdir -p "${CI_PROJECT_DIR}/.m2/repository"
  - |
    cat > "${CI_PROJECT_DIR}/.m2/settings.xml" <<'XML'
    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                  https://maven.apache.org/xsd/settings-1.0.0.xsd">
      <servers>
        <server>
          <id>gitlab-maven</id>
          <configuration>
            <httpHeaders>
              <property>
                <name>Job-Token</name>
                <value>${env.CI_JOB_TOKEN}</value>
              </property>
            </httpHeaders>
          </configuration>
        </server>
      </servers>
    </settings>
    XML
build:
  image: radut/openjdk-8-maven
  stage: build
  artifacts: {}
  allow_failure: false
  # `deploy` publishes to the Maven package registry, so only the default branch and release tags do it;
  # merge requests and other branches run `verify` (compile, tests, package) and publish nothing.
  variables:
    MAVEN_GOAL: verify
  script:
#    - mvn $MAVEN_CLI_OPTS clean package $MAVEN_OPTS
    - mvn $MAVEN_CLI_OPTS clean $MAVEN_GOAL $MAVEN_OPTS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      variables:
        MAVEN_GOAL: deploy
    - when: on_success


